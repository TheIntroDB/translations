name: Update Integration Translation Report

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate integration translation report
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_integration_translations.py

      - name: Commit updated report
        run: |
          if git diff --quiet; then
            echo "No report changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update integration translation report"
          git push
